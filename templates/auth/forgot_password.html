{% extends "base.html" %}

{% block title %}{{ t("auth.reset_title") }} | ONEBoard{% endblock %}

{% block body %}
<main class="auth-page">
  <section class="auth-panel">
    <div class="brand-block">
      <div class="brand-mark">OB</div>
      <div>
        <p class="brand-eyebrow">ONEBoard</p>
        <h1>{{ t("auth.reset_title") }}</h1>
      </div>
    </div>

    {% include "partials/alerts.html" %}

    <p class="settings-note">{{ t("auth.reset_instructions") }}</p>
    <form method="post" class="auth-form" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">{{ t("auth.email") }}</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="admin@empresa.com" autocomplete="email" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary w-100">{{ t("auth.reset_password") }}</button>
    </form>

    <p class="auth-footer">
      <a href="{{ url_for('login') }}">{{ t("auth.sign_in") }}</a>
    </p>
  </section>
</main>
{% endblock %}
