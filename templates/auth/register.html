{% extends "base.html" %}

{% block title %}{{ t("auth.register_title") }} | ONEBoard{% endblock %}

{% block body %}
<main class="auth-page">
  <section class="auth-panel">
    <div class="brand-block">
      <div class="brand-mark">OB</div>
      <div>
        <p class="brand-eyebrow">ONEBoard</p>
        <h1>{{ t("auth.register_title") }}</h1>
      </div>
    </div>

    {% include "partials/alerts.html" %}

    <form method="post" class="auth-form" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">{{ t("auth.name") }}</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="{{ t('auth.name') }}" autocomplete="name" required autofocus>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">{{ t("auth.email") }}</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="admin@empresa.com" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">{{ t("auth.password") }}</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="{{ t('auth.min_password') }}" autocomplete="new-password" required>
      </div>
      <div class="mb-4">
        <label for="confirm_password" class="form-label">{{ t("auth.confirm_password") }}</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="{{ t('auth.repeat_password') }}" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">{{ t("auth.create_account") }}</button>
    </form>

    <p class="auth-footer">
      {{ t("auth.has_account") }}
      <a href="{{ url_for('login') }}">{{ t("auth.sign_in") }}</a>
    </p>
  </section>
</main>
{% endblock %}
