{% extends "base.html" %}

{% block title %}{{ t("auth.reset_title") }} | ONEBoard{% endblock %}

{% block body %}
<main class="auth-page">
  <section class="auth-panel">
    <div class="brand-block">
      <div class="brand-mark">OB</div>
      <div>
        <p class="brand-eyebrow">ONEBoard</p>
        <h1>{{ t("auth.reset_title") }}</h1>
      </div>
    </div>

    {% include "partials/alerts.html" %}

    <form method="post" class="auth-form" novalidate>
      <div class="mb-3">
        <label for="password" class="form-label">{{ t("auth.new_password") }}</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="{{ t('auth.min_password') }}" autocomplete="new-password" required autofocus>
      </div>
      <div class="mb-4">
        <label for="confirm_password" class="form-label">{{ t("auth.confirm_password") }}</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="{{ t('auth.repeat_password') }}" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">{{ t("auth.reset_password") }}</button>
    </form>
  </section>
</main>
{% endblock %}
