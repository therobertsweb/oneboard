<!doctype html>
<html lang="{{ current_lang() }}" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c0c0e">
    <title>{% block title %}ONEBoard{% endblock %}</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  
  <body>
    {% block body %}{% endblock %}
    {% if active_workspace %}
    <script>
    (() => {
      const path = {{ active_workspace.path|tojson }};
      document.querySelectorAll('form[method="post"]').forEach((form) => {
        const action = new URL(form.action || location.href, location.href);
        if (!action.pathname.startsWith('/site-manager') && action.pathname !== '/security-scan') return;
        if (action.pathname === '/site-manager/connect') return;
        if (form.querySelector('[name="expected_directory_path"]')) return;
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'expected_directory_path';
        input.value = path;
        form.appendChild(input);
      });
    })();
    </script>
    {% endif %}
    <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
  </body>
</html>
