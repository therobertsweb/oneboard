name: oneboard_flutter
description: ONEBoard desktop app for macOS, built with Flutter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  cloud_firestore: ^7.1.0
  cupertino_icons: ^2.0.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
